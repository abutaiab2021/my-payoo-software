<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Payoo | Login</title>
    <!-- fab icon -->
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon" />
    <!-- google font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- tailwind css and daisy UI css link-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- for mordan theme -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- styles for all full html body -->
    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <!-- for login page logo -->
    <div class="logo w-[200px] mx-auto pt-32">
      <img src="assets/Logo-full.png" alt="" />
    </div>
    <!-- for login page form -->
    <div class="form pt-10">
      <div
        class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl"
      >
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Mobile Number</label>
            <input
              id="input-number"
              maxlength="11"
              minlength="11"
              type="text"
              value="01234567890"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter your 11 digit Number"
            />
            <br />
            <label class="label text-neutral font-bold">4 Digit Pin</label>
            <input
              id="input-pin"
              maxlength="4"
              type="password"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter 4 Digit Pin"
            />
            <!-- <div><a class="link link-hover">Forgot password?</a></div> -->
            <button id="login-btn" class="btn btn-primary mt-4 rounded-full">
              Login
              <span
                aria-hidden="true"
                class="fa fa-user-circle fa-2x fa-lg"
              ></span>
            </button>
          </fieldset>
        </div>
      </div>
    </div>
    <!-- login js file link -->
    <script src="script/login.js"></script>
  </body>
</html>
