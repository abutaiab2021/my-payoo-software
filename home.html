<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Payoo | Home</title>
    <!-- fab icon -->
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon" />
    <!-- google font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- tailwind css and daisy UI css link-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- for mordan theme -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- styles for all full html body -->
    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <!-- header section -->
    <header class="border-b-2 border-gray-300 sticky top-0 bg-base-200 z-10">
      <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
        <div class="left flex gap-1">
          <div class="logo w-[60px]">
            <img src="assets/logo.png" alt="" />
          </div>
          <div class="balance-info">
            <h2 class="text-2xl font-bold">$<span id="balance">45000</span></h2>
            <p class="text-neutral/50">Available Balance</p>
          </div>
        </div>
        <div class="right">
          <a href="/index.html" class="btn btn-soft">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>Logout
          </a>
        </div>
      </section>
    </header>

    <!-- all transation buttons -->
    <section class="bg-base-100 shadow rounded-b-2xl">
      <div class="w-11/12 mx-auto py-10 px-10 space-y-5">
        <h2 class="text-3xl font-bold">
          Welcome to Pay<span class="text-primary">oo</span>
        </h2>
        <p class="text-neutral/50 py-5">
          Enjoy easy and convenient financial services with us. Cashout charge
          is low and
        </p>
        <!-- buttons -->
        <div class="buttons grid grid-cols-3 gap-3">
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-1.png" alt="" />
            <p>Add Money</p>
          </button>
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-2.png" alt="" />
            <p>Cashout</p>
          </button>
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-3.png" alt="" />
            <p>Send Money</p>
          </button>
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-4.png" alt="" />
            <p>Get Bonus</p>
          </button>
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-5.png" alt="" />
            <p>Pay Bill</p>
          </button>
          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-6.png" alt="" />
            <p>Transactions</p>
          </button>
        </div>
      </div>
    </section>

    <!-- add money page-->
    <section id="add-money" class="w-11/12 mx-auto py-5">
      <h2 class="text-xl font-bold mb-2">Add Money</h2>
      <div class="card bg-base-100 w-full shadow rounded-2xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Select A Bank</label>
            <select
              id="bank-name"
              class="select select-primary rounded-full w-full bg-base-200"
            >
              <option disabled selected>Select Bank</option>
              <option>USB Bank</option>
              <option>NRB Bank</option>
              <option>City Bank</option>
            </select>

            <label class="label text-neutral font-bold"
              >Bank Account Number</label
            >
            <input
              id="bank-acc-num"
              type="text"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter Your 16 digit Account Number"
            />
            <label class="label text-neutral font-bold">Amount to Add</label>
            <input
              id="add-money-amt"
              type="number"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter amount to Money"
            />
            <label class="label text-neutral font-bold">4 Digit Pin</label>
            <input
              id="add-money-pin"
              maxlength="4"
              type="password"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter 4 Digit Pin Number"
            />
            <button
              id="add-money-btn"
              class="btn btn-primary mt-4 rounded-full"
            >
              Add Money<i class="fa-solid fa-arrow-left-to-bracket"></i>
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <!-- cashout page-->
    <section id="cashout" class="w-11/12 mx-auto py-5 hidden">
      <h2 class="text-xl font-bold mb-2">Cash Out</h2>
      <div class="card bg-base-100 w-full shadow rounded-2xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Agent Number</label>
            <input
              id="cashout-number"
              maxlength="11"
              minlength="11"
              type="text"
              value="01234567890"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter Agent 11 digit Number"
            />
            <label class="label text-neutral font-bold">Amount</label>
            <input
              id="cashout-amount"
              type="number"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter amount to withdraw"
            />
            <label class="label text-neutral font-bold">4 Digit Pin</label>
            <input
              id="cashout-pin"
              maxlength="4"
              type="password"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter 4 Digit Pin Number"
            />
            <!-- <div><a class="link link-hover">Forgot password?</a></div> -->
            <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full">
              Withdraw Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <!-- send money page-->
    <section id="cashout" class="w-11/12 mx-auto py-5 hidden">
      <h2 class="text-xl font-bold mb-2">Send Money</h2>
      <div class="card bg-base-100 w-full shadow rounded-2xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold"
              >User Account Number</label
            >
            <input
              id="send-money-number"
              maxlength="11"
              minlength="11"
              type="text"
              value="01234567890"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter user 11 digit Number"
            />
            <label class="label text-neutral font-bold">Amount</label>
            <input
              id="send-money-amount"
              type="number"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter amount to withdraw"
            />
            <label class="label text-neutral font-bold">4 Digit Pin</label>
            <input
              id="send-money-pin"
              maxlength="4"
              type="password"
              class="input input-primary rounded-full w-full bg-base-200"
              placeholder="Enter 4 Digit Pin Number"
            />
            <!-- <div><a class="link link-hover">Forgot password?</a></div> -->
            <button
              id="send-money-btn"
              class="btn btn-primary mt-4 rounded-full"
            >
              Send Now<i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <!-- maschine form conneted link-->
    <script src="script/maschine.js"></script>
    <!-- add money form connected link -->
    <script src="script/addmoney.js"></script>
    <!-- cash out form conneted  link-->
    <script src="script/cashout.js"></script>
    <!-- send money page link -->
    <script src="script/sendmoney.js"></script>
  </body>
</html>
